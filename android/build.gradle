buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
        googlePlayServicesVersion = "21.0.1"
        playServicesVersion = "21.0.1"
        // react-native-video 6.19.x is compiled against this media3 release.
        // It is also read by react-native-video's own build.gradle.
        media3Version = "1.8.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        classpath ('com.google.gms:google-services:4.4.1')
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    
    configurations.all {
        resolutionStrategy {
            exclude group: 'com.android.support', module: 'support-v4'
            exclude group: 'com.android.support', module: 'appcompat-v7'
            force 'com.google.android.gms:play-services-location:21.0.1'
            // Pin every media3 artifact. If anything pulls a newer media3 in,
            // react-native-video crashes natively the first time a video plays
            // (NoSuchMethodError: DefaultLoadControl.<init>), which is the
            // feed crash on EAS production builds.
            eachDependency { details ->
                if (details.requested.group == 'androidx.media3') {
                    details.useVersion(rootProject.ext.media3Version)
                    details.because('react-native-video is compiled against this media3 version')
                }
            }
        }
    }
}