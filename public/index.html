<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iCampus Classroom</title>
    <style>
      html, body, #root {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }
      /* React Native Web's app root is flex: 1, so its parent must be flex
         for the app to fill the window (otherwise it stops part-way down). */
      #root {
        display: flex;
        flex-direction: column;
      }
      /* Icon fonts, copied into dist/fonts by scripts/build-web.js. The
         family names are what the icon libraries use on web. */
      @font-face { font-family: 'MaterialIcons'; src: url('./fonts/MaterialIcons.ttf') format('truetype'); }
      @font-face { font-family: 'MaterialCommunityIcons'; src: url('./fonts/MaterialCommunityIcons.ttf') format('truetype'); }
      @font-face { font-family: 'antfill'; src: url('./fonts/antfill.ttf') format('truetype'); }
      @font-face { font-family: 'antoutline'; src: url('./fonts/antoutline.ttf') format('truetype'); }
    </style>
  </head>
  <body>
    <!-- This is the container element where React Native Web mounts your App -->
    <div id="root"></div>
    <script src="./bundle.js"></script>
  </body>
</html>
